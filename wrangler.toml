name = "tv-repositorio"
main = "worker/index.js"
compatibility_date = "2026-01-01"

# La página se sirve como asset estático: pesa varios MB y no entraría
# en el límite de tamaño del script del Worker.
assets = { directory = "./public", binding = "ASSETS" }

# Identificador del almacén donde viven los tildes. No es un secreto: sin el
# token de la cuenta no da acceso a nada.
[[kv_namespaces]]
binding = "ESTADO"
id = "7ad25bd3829b467099a465d5cac5e2d4"
