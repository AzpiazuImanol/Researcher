name: Publicar

# Un solo camino: bajar lo que falte, armar la página y publicarla.
# Antes eran dos workflows y el commit de portadas no disparaba el deploy,
# porque GitHub no reencadena workflows disparados por su propio token.
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "tv.html"
      - "worker/**"
      - "wrangler.toml"
      - ".github/workflows/publicar.yml"

permissions:
  contents: write

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Bajar portadas que falten
        run: node scripts/fetch-posters.mjs

      - name: Guardar portadas nuevas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posters.json
          git diff --staged --quiet && { echo "sin portadas nuevas"; exit 0; }
          git commit -m "Update cover art data"

          # La descarga tarda; la rama puede haberse movido mientras tanto.
          for intento in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${{ github.ref_name }}" \
               && git push origin "HEAD:${{ github.ref_name }}"; then
              exit 0
            fi
            sleep $((intento * 5))
          done
          echo "::error::no se pudo guardar posters.json"
          exit 1

      - name: Armar la página
        run: node scripts/build.mjs

      - name: Publicar en Cloudflare
        if: env.CF_TOKEN != ''
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Aviso si falta el token
        if: env.CF_TOKEN == ''
        run: echo "::warning::Sin CLOUDFLARE_API_TOKEN no se publica. Cargalo en Settings → Secrets → Actions."
