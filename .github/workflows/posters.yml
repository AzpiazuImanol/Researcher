name: Fetch cover art

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/posters.yml"

permissions:
  contents: write

jobs:
  posters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download covers
        run: node scripts/fetch-posters.mjs

      - name: Commit posters.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posters.json
          git diff --staged --quiet || git commit -m "Update cover art data"
          git push
